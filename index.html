<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse-maxxing</title>
    <link rel="icon" type="image/x-icon" href="https://github.githubassets.com/favicons/favicon.svg">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #f5f5f7;
            --text-dim: #86868b;
            --accent-color: #0071e3;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
        }

        .logo {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.01em;
        }

        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 12px;
            margin-left: 24px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--text-color);
        }

        /* Hamburger Open Button */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 18px;
            height: 10px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }

        .hamburger span {
            width: 100%;
            height: 2px;
            background-color: var(--text-color);
            transition: all 0.3s ease;
        }

        /* Mobile Fullscreen Menu Overlay */
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(5, 5, 5, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1050;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .mobile-menu-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* X Close Button inside Overlay */
        .menu-close-btn {
            position: absolute;
            top: 16px;
            right: 24px;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-close-btn::before,
        .menu-close-btn::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 2px;
            background-color: var(--text-color);
        }
        .menu-close-btn::before { transform: rotate(45deg); }
        .menu-close-btn::after { transform: rotate(-45deg); }

        .mobile-menu-overlay a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.02em;
            transition: color 0.2s, transform 0.2s;
        }

        /* Highlight Active Section in Mobile View */
        .mobile-menu-overlay a.active {
            color: var(--text-color);
            font-weight: 600;
            transform: scale(1.05);
        }

        main {
            height: 100vh;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            will-change: transform;
        }

        section {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 6% 40px 6%;
            position: relative;
        }

        /* Premium Sleek Intro Layout */
        .intro-container {
            text-align: center;
            max-width: 840px;
            z-index: 10;
        }

        .intro-container h1 {
            font-size: 64px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #ffffff 30%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .intro-container p {
            font-size: 21px;
            color: var(--text-dim);
            line-height: 1.45;
            font-weight: 400;
            margin-bottom: 40px;
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
            letter-spacing: -0.01em;
        }

        /* Minimalist Sleek Scroll Indicator */
        .sleek-scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .sleek-scroll-indicator:hover {
            opacity: 1;
        }

        .indicator-dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-color);
            border-radius: 50%;
            animation: pulse-breathing 2s infinite ease-in-out;
        }

        .indicator-arrow {
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--text-dim);
            border-bottom: 2px solid var(--text-dim);
            transform: rotate(45deg);
        }

        @keyframes pulse-breathing {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.5); opacity: 1; }
        }

        /* Showcase Layout Structures */
        .showcase-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            align-items: center;
            gap: 40px;
        }

        .showcase-container.reverse {
            flex-direction: row-reverse;
        }

        .showcase-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-self: center;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            transition-delay: 0.2s;
        }

        section.active .showcase-text {
            opacity: 1;
            transform: translateY(0);
        }

        .tagline {
            color: var(--accent-color);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.1em;
        }

        h2 {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 18px;
        }

        .desc {
            color: var(--text-dim);
            font-size: 16px;
            line-height: 1.5;
            font-weight: 400;
        }

        .showcase-visual {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-self: center;
            width: 100%;
        }

        .media-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            backdrop-filter: blur(var(--blur-radius));
            -webkit-backdrop-filter: blur(var(--blur-radius));
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .media-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .standard-container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            align-self: center;
            max-height: 85vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* CAROUSEL MULTI-TRACK SYSTEM */
        .carousel-track-container {
            width: 100%;
            overflow: hidden;
            padding: 10px 0;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent);
        }

        .carousel-track {
            display: flex;
            gap: 14px;
            width: max-content;
        }

        .carousel-track.row-1, .carousel-track.row-3 {
            animation: loopScrollerRTL 120s linear infinite;
        }

        .carousel-track.row-2, .carousel-track.row-4 {
            animation: loopScrollerLTR 120s linear infinite;
        }

        .carousel-track:hover {
            animation-play-state: paused;
        }

        .idea-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            color: var(--text-color);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        /* TRIPLE MARQUEE ENGINE FOR BRANDS */
        .marquee-wrapper {
            margin-top: 40px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
        }

        .marquee-inner {
            display: flex;
            gap: 40px;
            width: max-content;
        }

        .marquee-inner.row-1, .marquee-inner.row-3 {
            animation: loopScrollerRTL 50s linear infinite;
        }

        .marquee-inner.row-2 {
            animation: loopScrollerLTR 50s linear infinite;
        }

        .marquee-inner:hover {
            animation-play-state: paused;
        }

        .marquee-item {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-dim);
            text-transform: lowercase;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        @keyframes loopScrollerRTL {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        @keyframes loopScrollerLTR {
            0% { transform: translate3d(-50%, 0, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        /* Layout Framework Grids */
        .price-grid {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }

        .price-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            flex: 1;
            max-width: 350px;
            backdrop-filter: blur(20px);
            text-align: left;
        }

        .price-num {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0;
        }

        .faq-wrap {
            margin-top: 30px;
            text-align: left;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .faq-item {
            border-bottom: 1px solid var(--glass-border);
            padding: 18px 0;
        }

        .faq-q {
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .faq-a {
            color: var(--text-dim);
            margin-top: 10px;
            line-height: 1.5;
            display: none;
            font-size: 14px;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 28px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
            margin-top: 30px;
        }

        .btn:hover {
            background-color: #0077ed;
            transform: scale(1.02);
        }

        .dots-indicator {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: var(--text-color);
        }

        /* MOBILE MEDIA QUERIES */
        @media (max-width: 768px) {
            header {
                padding: 0 24px;
            }
            
            nav {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .dots-indicator {
                display: none;
            }

            section {
                padding: 70px 20px 30px 20px;
            }

            .intro-container h1 {
                font-size: 42px;
            }

            .intro-container p {
                font-size: 17px;
            }

            h2 {
                font-size: 26px;
                margin-bottom: 12px;
            }

            .desc {
                font-size: 14px;
            }

            .showcase-container, 
            .showcase-container.reverse {
                flex-direction: column;
                justify-content: center;
                gap: 24px;
            }

            .showcase-text {
                align-self: center;
                text-align: center;
                flex: none;
            }

            .showcase-visual {
                flex: none;
            }

            .price-grid {
                flex-direction: column;
                align-items: center;
            }

            .price-card {
                width: 100%;
                max-width: 1000px;
                padding: 20px;
            }
            
            .marquee-wrapper {
                margin-top: 25px;
                gap: 12px;
            }
            
            .carousel-track-container {
                gap: 8px;
            }
        }
    </style>
</head>

        const mainContainer = document.getElementById('scrollContainer');
        const navLinks = document.getElementById('navLinks');
        const dotsIndicator = document.getElementById('dotsIndicator');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const menuCloseBtn = document.getElementById('menuCloseBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        let currentIndex = 0;
        let isScrolling = false;
        let showcaseCounter = 0; 
        const totalSections = landingPagesConfig.sections.length;

        function openMobileMenu() { mobileMenu.classList.add('open'); }
        function closeMobileMenu() { mobileMenu.classList.remove('open'); }

        hamburgerBtn.addEventListener('click', openMobileMenu);
        menuCloseBtn.addEventListener('click', closeMobileMenu);

        function buildWebsiteArchitecture() {
            landingPagesConfig.sections.forEach((sectionData, idx) => {
                if (sectionData.navLabel) {
                    const navAnchor = document.createElement('a');
                    navAnchor.href = "#";
                    navAnchor.textContent = sectionData.navLabel;
                    if (idx === 0) navAnchor.classList.add('active');
                    navAnchor.addEventListener('click', (e) => { e.preventDefault(); scrollToIndex(idx); });
                    navLinks.appendChild(navAnchor);
                }

                if (sectionData.navLabel) {
                    const mobileAnchor = document.createElement('a');
                    mobileAnchor.href = "#";
                    mobileAnchor.textContent = sectionData.navLabel;
                    if (idx === 0) mobileAnchor.classList.add('active');
                    mobileAnchor.addEventListener('click', (e) => { 
                        e.preventDefault(); 
                        closeMobileMenu();
                        scrollToIndex(idx); 
                    });
                    mobileMenu.appendChild(mobileAnchor);
                }

                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (idx === 0) dot.classList.add('active');
                dot.addEventListener('click', () => scrollToIndex(idx));
                dotsIndicator.appendChild(dot);

                const sectionEl = document.createElement('section');
                if (idx === 0) sectionEl.classList.add('active');

                if (sectionData.type === "intro") {
                    sectionEl.innerHTML = `
                        <div class="intro-container">
                            <h1>${sectionData.title}</h1>
                            <p>${sectionData.desc}</p>
                            <a href="#" class="btn" id="introCtaBtn">${sectionData.ctaText}</a>
                        </div>
                        <div class="sleek-scroll-indicator" id="sleekScrollIndicator">
                            <div class="indicator-dot"></div>
                            <div class="indicator-arrow"></div>
                        </div>`;
                }
                else if (sectionData.type === "showcase") {
                    const isEven = (showcaseCounter % 2 === 0);
                    showcaseCounter++;
                    
                    sectionEl.innerHTML = `
                        <div class="showcase-container ${isEven ? '' : 'reverse'}">
                            <div class="showcase-text">
                                <div class="tagline">${sectionData.tagline}</div>
                                <h2>${sectionData.title}</h2>
                                <div class="desc">${sectionData.desc}</div>
                            </div>
                            <div class="showcase-visual">
                                <div class="media-box">
                                    <img src="" data-source-url="${sectionData.gifUrl}" alt="${sectionData.title}">
                                </div>
                            </div>
                        </div>`;
                } 
                else if (sectionData.type === "upcoming-carousel") {
                    const sliceCount = Math.ceil(sectionData.carouselIdeas.length / 4);
                    const part1 = sectionData.carouselIdeas.slice(0, sliceCount);
                    const part2 = sectionData.carouselIdeas.slice(sliceCount, sliceCount * 2);
                    const part3 = sectionData.carouselIdeas.slice(sliceCount * 2, sliceCount * 3);
                    const part4 = sectionData.carouselIdeas.slice(sliceCount * 3);

                    const row1Markup = [...part1, ...part1, ...part1].map(i => `<div class="idea-card">${i}</div>`).join('');
                    const row2Markup = [...part2, ...part2, ...part2].map(i => `<div class="idea-card">${i}</div>`).join('');
                    const row3Markup = [...part3, ...part3, ...part3].map(i => `<div class="idea-card">${i}</div>`).join('');
                    const row4Markup = [...part4, ...part4, ...part4].map(i => `<div class="idea-card">${i}</div>`).join('');
                    
                    sectionEl.innerHTML = `
                        <div class="standard-container">
                            <div class="tagline">${sectionData.tagline}</div>
                            <h2>${sectionData.title}</h2>
                            <p class="desc" style="margin-bottom: 24px;">${sectionData.desc}</p>
                            <div class="carousel-track-container">
                                <div class="carousel-track row-1">${row1Markup}</div>
                                <div class="carousel-track row-2">${row2Markup}</div>
                                <div class="carousel-track row-3">${row3Markup}</div>
                                <div class="carousel-track row-4">${row4Markup}</div>
                            </div>
                        </div>`;
                }
                else if (sectionData.type === "marquee-brand") {
                    const sliceCount = Math.ceil(sectionData.brands.length / 3);
                    const part1 = sectionData.brands.slice(0, sliceCount);
                    const part2 = sectionData.brands.slice(sliceCount, sliceCount * 2);
                    const part3 = sectionData.brands.slice(sliceCount * 2);

                    const row1Markup = [...part1, ...part1, ...part1, ...part1].map(b => `<div class="marquee-item">${b}</div>`).join('');
                    const row2Markup = [...part2, ...part2, ...part2, ...part2].map(b => `<div class="marquee-item">${b}</div>`).join('');
                    const row3Markup = [...part3, ...part3, ...part3, ...part3].map(b => `<div class="marquee-item">${b}</div>`).join('');
                    
                    sectionEl.innerHTML = `
                        <div class="standard-container">
                            <div class="tagline">${sectionData.tagline}</div>
                            <h2>${sectionData.title}</h2>
                            <p class="desc">${sectionData.desc}</p>
                            <div class="marquee-wrapper">
                                <div class="marquee-inner row-1">${row1Markup}</div>
                                <div class="marquee-inner row-2">${row2Markup}</div>
                                <div class="marquee-inner row-3">${row3Markup}</div>
                            </div>
                        </div>`;
                }
                else if (sectionData.type === "faq") {
                    const faqMarkup = sectionData.faqs.map(faq => `
                        <div class="faq-item">
                            <div class="faq-q">${faq.q} <span>+</span></div>
                            <div class="faq-a">${faq.a}</div>
                        </div>
                    `).join('');
                    sectionEl.innerHTML = `
                        <div class="standard-container">
                            <div class="tagline">${sectionData.tagline}</div>
                            <h2>${sectionData.title}</h2>
                            <div class="faq-wrap">${faqMarkup}</div>
                            <div><a href="${sectionData.actionButton.href}" class="btn">${sectionData.actionButton.text}</a></div>
                        </div>`;
                }

                mainContainer.appendChild(sectionEl);
            });

            document.getElementById('introCtaBtn').addEventListener('click', (e) => { e.preventDefault(); scrollToIndex(1); });
            document.getElementById('sleekScrollIndicator').addEventListener('click', () => scrollToIndex(1));
        }

        buildWebsiteArchitecture();
        const compiledSections = document.querySelectorAll('section');
        const compiledDots = document.querySelectorAll('.dot');
        const desktopMenuLinks = navLinks.querySelectorAll('a');
        const mobileMenuLinks = mobileMenu.querySelectorAll('a');

        function scrollToIndex(index) {
            if (index < 0 || index >= totalSections) return;
            isScrolling = true;
            currentIndex = index;

            mainContainer.style.transform = `translateY(-${currentIndex * 100}vh)`;

            compiledSections.forEach((sec, idx) => {
                idx === currentIndex ? sec.classList.add('active') : sec.classList.remove('active');
            });

            compiledDots.forEach((dot, idx) => {
                idx === currentIndex ? dot.classList.add('active') : dot.classList.remove('active');
            });

            desktopMenuLinks.forEach((link, idx) => {
                idx === currentIndex ? link.classList.add('active') : link.classList.remove('active');
            });

            mobileMenuLinks.forEach((link, idx) => {
                idx === currentIndex ? link.classList.add('active') : link.classList.remove('active');
            });

            manageTargetGifStates(compiledSections[currentIndex]);

            setTimeout(() => { isScrolling = false; }, 800);
        }

        function manageTargetGifStates(activeSection) {
            const dynamicImg = activeSection.querySelector('img[data-source-url]');
            if (dynamicImg) {
                const pureUrl = dynamicImg.getAttribute('data-source-url');
                dynamicImg.src = pureUrl + '?epoch=' + new Date().getTime();
            }
        }

        window.addEventListener('wheel', (e) => {
            if (isScrolling || mobileMenu.classList.contains('open')) return;
            if (e.deltaY > 25 && currentIndex < totalSections - 1) {
                scrollToIndex(currentIndex + 1);
            } else if (e.deltaY < -25 && currentIndex > 0) {
                scrollToIndex(currentIndex - 1);
            }
        }, { passive: true });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchend', (e) => {
            if (isScrolling || mobileMenu.classList.contains('open')) return;
            let distance = touchStartY - e.changedTouches[0].clientY;
            if (distance > 50 && currentIndex < totalSections - 1) {
                scrollToIndex(currentIndex + 1);
            } else if (distance < -50 && currentIndex > 0) {
                scrollToIndex(currentIndex - 1);
            }
        }, { passive: true });

        document.addEventListener('click', (e) => {
            const header = e.target.closest('.faq-q');
            if (!header) return;
            const answer = header.nextElementSibling;
            const marker = header.querySelector('span');
            if (answer.style.display === 'block') {
                answer.style.display = 'none';
                marker.textContent = '+';
            } else {
                answer.style.display = 'block';
                marker.textContent = '-';
            }
        });

        manageTargetGifStates(compiledSections[0]);
    </script>
</body>
</html>
